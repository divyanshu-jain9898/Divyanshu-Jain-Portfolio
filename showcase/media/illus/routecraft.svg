<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16243a" stroke-width="1"/></pattern>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e4ef"/><stop offset=".5" stop-color="#9fb2c7"/><stop offset="1" stop-color="#5f7189"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ff3dc"/><stop offset=".5" stop-color="#4fe3c1"/><stop offset="1" stop-color="#1e8f78"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0a111c"/>
  <rect width="1280" height="720" fill="url(#g)"/>
  <!-- iso axes -->
  <g stroke="#2a3a52" stroke-width="2"><path d="M150 610l70-40M150 610v-80M150 610l-70-40"/></g>
  <g font-size="14" fill="#7f8da1"><text x="226" y="568">E</text><text x="144" y="520">Up</text><text x="64" y="568">N</text></g>
  <!-- routed line: iso segments with rounded elbows -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 470 L470 332 Q490 320 510 332 L700 442 Q720 454 740 442 L740 250 Q740 228 760 216 L1010 72" stroke="#0a111c" stroke-width="44"/>
    <path d="M230 470 L470 332 Q490 320 510 332 L700 442 Q720 454 740 442 L740 250 Q740 228 760 216 L1010 72" stroke="url(#acc)" stroke-width="30"/>
    <path d="M230 470 L470 332 Q490 320 510 332 L700 442 Q720 454 740 442 L740 250 Q740 228 760 216 L1010 72" stroke="#c9fff2" stroke-opacity=".35" stroke-width="6" transform="translate(-4 -6)"/>
  </g>
  <!-- flanges -->
  <g fill="#e6eef6" stroke="#0a111c" stroke-width="2">
    <rect x="356" y="380" width="14" height="48" rx="3" transform="rotate(-30 363 404)"/>
    <rect x="600" y="368" width="14" height="48" rx="3" transform="rotate(30 607 392)"/>
    <rect x="716" y="330" width="48" height="14" rx="3"/>
    <rect x="880" y="125" width="14" height="48" rx="3" transform="rotate(-30 887 149)"/>
  </g>
  <!-- gate valve -->
  <g transform="translate(740 300)">
    <rect x="-26" y="-24" width="52" height="48" rx="8" fill="#f7b23b" stroke="#0a111c" stroke-width="3"/>
    <path d="M-18 -16 0 0 -18 16M18 -16 0 0 18 16" fill="none" stroke="#3a2400" stroke-width="3"/>
    <path d="M26 0h44" stroke="#f7b23b" stroke-width="7"/>
    <ellipse cx="78" cy="0" rx="10" ry="28" fill="none" stroke="#f7b23b" stroke-width="6"/>
  </g>
  <!-- vent + drain -->
  <g stroke="#4fe3c1" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M620 400 v-70"/><path d="M490 326 v84"/>
  </g>
  <g fill="#0a111c" stroke="#4fe3c1" stroke-width="3"><circle cx="620" cy="322" r="11"/><circle cx="490" cy="418" r="11"/></g>
  <!-- supports -->
  <g fill="#7c8ea8">
    <rect x="296" y="446" width="18" height="70" rx="2"/><rect x="276" y="512" width="58" height="10" rx="2"/>
    <rect x="928" y="128" width="16" height="64" rx="2"/><rect x="910" y="188" width="52" height="10" rx="2"/>
  </g>
  <!-- callouts -->
  <g font-size="17" fill="#e8eef6">
    <g transform="translate(510 300)"><path d="M0 22 V-48" stroke="#4fe3c1" stroke-dasharray="4 5"/><rect x="-6" y="-92" width="196" height="40" rx="10" fill="#111a28" stroke="#2c3d56"/><text x="12" y="-66">Elbow 90° · auto</text></g>
    <g transform="translate(620 300)"><rect x="40" y="-148" width="168" height="40" rx="10" fill="#111a28" stroke="#2c3d56"/><text x="58" y="-122">Vent · ¾" · auto</text><path d="M0 22 L40 -110" stroke="#4fe3c1" stroke-dasharray="4 5"/></g>
    <g transform="translate(490 430)"><rect x="-210" y="40" width="176" height="40" rx="10" fill="#111a28" stroke="#2c3d56"/><text x="-192" y="66">Drain · low point</text><path d="M0 0 L-60 40" stroke="#4fe3c1" stroke-dasharray="4 5"/></g>
    <g transform="translate(820 300)"><rect x="40" y="10" width="222" height="40" rx="10" fill="#111a28" stroke="#f7b23b" stroke-opacity=".6"/><text x="58" y="36">Gate valve · at offset</text></g>
    <g transform="translate(944 160)"><rect x="40" y="18" width="196" height="40" rx="10" fill="#111a28" stroke="#2c3d56"/><text x="58" y="44">Shoe support · auto</text></g>
  </g>
  <!-- step history panel -->
  <g transform="translate(1000 420)">
    <rect width="240" height="250" rx="16" fill="#0e1622" stroke="#24344c"/>
    <text x="20" y="34" font-size="13" fill="#7f8da1" letter-spacing="2">STEP HISTORY</text>
    <g font-size="15" fill="#c9d4e2">
      <text x="20" y="72">1  Start at nozzle N2</text>
      <text x="20" y="104">2  Route E 6.0 m</text>
      <text x="20" y="136">3  Elbow + route S 4.2 m</text>
      <text x="20" y="168">4  Valve at 1.2 m</text>
      <text x="20" y="200" fill="#4fe3c1">5  Vent + drain ✓</text>
    </g>
    <rect x="20" y="218" width="88" height="20" rx="6" fill="#16263a"/><text x="38" y="233" font-size="12" fill="#e8eef6">↶ Undo</text>
  </g>
  <text x="56" y="80" font-size="30" font-weight="700" fill="#e8eef6">RouteCraft 3D</text>
  <text x="56" y="112" font-size="17" fill="#8a9ab0">Interactive piping in the live Smart 3D model</text>
</svg>
